name: Feature request
description: Propose an improvement connected to researcher visibility or reproducibility
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: user-value
    attributes:
      label: User or research value
      description: Explain who benefits and which problem is solved.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List measurable conditions that confirm completion.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Data, fairness, or reproducibility risks

