name: CI and release image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify Python syntax
        run: python -m compileall -q app scripts tests

      - name: Run critical Ruff checks
        run: python -m ruff check app scripts tests --select E9,F63,F7,F82

      - name: Run automated tests
        run: python -m pytest -q

  docker-build:
    name: Verify Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build lightweight API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            INSTALL_ML=false
          tags: academic-recommendation-system:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-image:
    name: Publish tagged image to GHCR
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            INSTALL_ML=false
          tags: ghcr.io/aslanabishev/academic-recommendation-system:${{ github.ref_name }}

